<!DOCTYPE html>
<html lang="pt-bt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário</title>
    <style>
        * {
            font-family: Arial, Helvetica, sans-serif;
        }
    </style>
</head>
<body>
    <h1>Meu primeiro formulário</h1>
    <form action="cadastro.php" method="post" autocomplete="off">
        <p><label for="inome">Nome:</label> <input type="text" name="nome" id="inome"></p>
        <p><label for="isobrenome">Sobrenome</label> <input type="text" name="Sobrenome" id="isobrenome"></p>
        <p><input type="submit" value="Enviar"></p>
        <!-- name é útil para HTML e php e id para CSS e JavaScript-->
         <!-- usar get quando os dados não forem sensíveis (nome/sobrenome/peso/altura/documento/etc)
                usar post quando tem dados sensíveis e pessoais-->
        <!-- https para proteger dados-->
    </form>
</body>
</html>
